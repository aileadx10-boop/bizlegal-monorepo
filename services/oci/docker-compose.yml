services:
  router:
    build:
      context: ./router
      dockerfile: Dockerfile
    container_name: deal-router
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: deal-router-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "80mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    mem_limit: 96m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
