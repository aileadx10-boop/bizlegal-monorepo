# Fallback nginx config — only used if Moses picks certbot+nginx over Caddy.
# Symlink to /etc/nginx/sites-enabled/router.conf, then `nginx -t && systemctl reload nginx`.

server {
    listen 80;
    server_name router.bizlegal-ai.com;

    # certbot --webroot path; remove the redirect block for HTTP-only debug
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name router.bizlegal-ai.com;

    ssl_certificate /etc/letsencrypt/live/router.bizlegal-ai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/router.bizlegal-ai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 64k;

    gzip on;
    gzip_types application/json text/plain;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
