<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BizLegal AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      width: 280px;
      min-height: 320px;
      padding: 0;
    }

    .header {
      background: #111111;
      border-bottom: 1px solid #1f1f1f;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-mark {
      width: 24px;
      height: 24px;
      background: #6366f1;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      color: #fff;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 13px;
      font-weight: 600;
      color: #e5e5e5;
      letter-spacing: -0.02em;
    }

    .logo-text span {
      color: #6366f1;
    }

    .actions {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      background: #161616;
      border: 1px solid #272727;
      border-radius: 8px;
      color: #e5e5e5;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background 120ms, border-color 120ms;
    }

    .btn:hover {
      background: #1c1c1c;
      border-color: #3a3a3a;
    }

    .btn:active {
      background: #212121;
    }

    .btn:focus-visible {
      outline: 2px solid #6366f1;
      outline-offset: 2px;
    }

    .btn-icon {
      width: 28px;
      height: 28px;
      background: #1e1e2e;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .btn-primary .btn-icon {
      background: #3730a3;
    }

    .btn-label {
      flex: 1;
    }

    .btn-label-main {
      display: block;
      color: #e5e5e5;
    }

    .btn-label-sub {
      display: block;
      color: #6b7280;
      font-size: 10px;
      margin-top: 1px;
    }

    .status-area {
      margin: 0 12px 4px;
      padding: 8px 10px;
      background: #0f0f1a;
      border: 1px solid #1a1a2e;
      border-radius: 6px;
      min-height: 36px;
      display: flex;
      align-items: center;
    }

    #status-msg {
      font-size: 11px;
      color: #6b7280;
      line-height: 1.4;
    }

    #status-msg.ok    { color: #22c55e; }
    #status-msg.error { color: #ef4444; }
    #status-msg.busy  { color: #a78bfa; }

    .footer {
      padding: 8px 12px 10px;
      display: flex;
      justify-content: flex-end;
    }

    .settings-link {
      font-size: 11px;
      color: #4b5563;
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }

    .settings-link:hover { color: #6366f1; }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo-mark">B</div>
    <span class="logo-text">BizLegal <span>AI</span></span>
  </header>

  <div class="actions">
    <button class="btn btn-primary" id="btn-capture" aria-label="Capture current page for compliance analysis">
      <span class="btn-icon">📋</span>
      <span class="btn-label">
        <span class="btn-label-main">Capture Page</span>
        <span class="btn-label-sub">Send page text to BizLegal agents</span>
      </span>
    </button>

    <button class="btn" id="btn-contract" aria-label="Analyze selected text as contract">
      <span class="btn-icon">📄</span>
      <span class="btn-label">
        <span class="btn-label-main">Analyze Contract</span>
        <span class="btn-label-sub">Send selected text to DocAI</span>
      </span>
    </button>

    <button class="btn" id="btn-compliance" aria-label="Check this URL for compliance issues">
      <span class="btn-icon">🛡️</span>
      <span class="btn-label">
        <span class="btn-label-main">Check Compliance</span>
        <span class="btn-label-sub">Run URL through BRAI scanner</span>
      </span>
    </button>

    <button class="btn" id="btn-wallet" aria-label="Track selected wallet address">
      <span class="btn-icon">🔗</span>
      <span class="btn-label">
        <span class="btn-label-main">Track Wallet</span>
        <span class="btn-label-sub">Send ETH address to Tracr</span>
      </span>
    </button>
  </div>

  <div class="status-area">
    <span id="status-msg">Ready — select text or open a page to begin.</span>
  </div>

  <footer class="footer">
    <button class="settings-link" id="btn-settings">Settings &amp; API key</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
